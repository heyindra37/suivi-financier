<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>Finance Tracker Kantong</title>
  
  <link rel="icon" type="image/png" href="https://cdn-icons-png.flaticon.com/512/3135/3135715.png">
  
  <style>
    /* CSS untuk menghilangkan margin bawaan browser */
    body, html {
      margin: 0;
      padding: 0;
      height: 100%;
      background-color: #f8fafc; /* Warna background utama aplikasi */
      overflow: hidden; /* Mencegah munculnya scrollbar ganda */
    }
    
    /* Trik Ninja menyembunyikan Banner Google */
    iframe {
      border: none;
      width: 100%;
      /* Tinggi banner Google adalah sekitar 28px-30px */
      /* Kita dorong ke atas (-30px) lalu tingginya ditambah (100% + 30px) agar bawahnya tidak terpotong */
      margin-top: -30px;
      height: calc(100% + 30px);
      display: block;
    }
  </style>
</head>
<body>

  <iframe src=https://script.google.com/macros/s/AKfycbwEVv2Aqd_exWV3RD9d3_1sq1UydXwlE2EDKCoUVzQS8TRY1TWkZgNHmQnRZCBEy_1TOA/exec></iframe>

</body>
</html>
